# Golden set para audit top-down — Fase 0 (ver docs/adr/017 cuando exista).
#
# Esquema por entry:
#   id: identificador estable q001..qNNN
#   q: pregunta literal del usuario
#   category: agrupador (geo_count, salud, educacion, contratacion, seguridad,
#             economia, ambiente, comparativa, temporal, adversarial, known_bad)
#   expected_intent: count | count_in | list | aggregate | comparative |
#                    temporal | descriptive | cross_source | search
#   expected_territory: nombre humano (null si no aplica)
#   expected_territory_code: DIVIPOLA (str). 2 chars=dpto, 5 chars=mpio. null si nacional.
#   expected_dataset_id: Socrata 4x4. null si todavía no curado.
#   expected_dataset_must_match_jurisdiction: true si el dataset DEBE cubrir el territorio
#   not_acceptable_datasets: lista de ids que SI aparecen como top-1 es failure
#   needs_curation: true mientras expected_dataset_id sea null
#   notes: contexto breve
#
# Reglas:
# - Si needs_curation=true, el eval harness NO penaliza por mismatch de dataset,
#   solo loggea el dataset elegido. Sirve para construir baseline.
# - Las queries con id qXXX (X≥90) son "known_bad" capturadas desde producción.
# - Curaduría progresiva: cada PR de retrieval debe convertir ≥3 entries de
#   needs_curation=true a false.

