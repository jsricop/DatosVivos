# Nginx — reverse proxy local y de producción.
#
# Routing:
#   /            → web (Next.js, 3001)
#   /api/v1/*    → api (FastAPI, 8000)
#   /legacy/*    → streamlit (8501, profile=legacy)
#   /healthz     → respuesta plana 200 OK para load balancers
#
# SSE: `/api/v1/query` requiere proxy_buffering off. Eso se hace explícito.
# Decisión: ADR-013.

upstream web_upstream {
    server web:3001;
}
upstream api_upstream {
    server api:8000;
}
upstream legacy_upstream {
    server streamlit:8501;
}

server {
    listen 80;
    server_name _;

    # Hardening básico.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self)" always;

    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API — soporte SSE.
    location /api/v1/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: no buffering, sin compresión, sin timeout corto.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
        chunked_transfer_encoding on;
    }

    # Streamlit legacy (cutover 30 días). Si el servicio no está corriendo
    # (profile=legacy), Nginx devuelve 502 y eso es esperado.
    location /legacy/ {
        rewrite ^/legacy/?(.*)$ /$1 break;
        proxy_pass http://legacy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Frontend Next.js.
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
