# DatosVivos — Docker Compose
# Orquesta los 6 servicios descritos en MAIN.md §6.1.
# Configuración detallada pendiente de Sprint 1/4.

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - ollama

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mcp-server

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - api

  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - streamlit
      - api

volumes:
  ollama_models:
  postgres_data:
