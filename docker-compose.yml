# DatosVivos — Docker Compose
#
# Estado (Beta-2, rebrand civic-editorial):
#   - mcp-server  → ✅ funcional (Sprint 1)        — clientes MCP externos
#   - api         → ✅ FastAPI + SSE (ADR-013)     — backend de la SPA
#   - web         → ✅ Next.js 15 (ADR-011)        — frontend Civic Editorial
#   - streamlit   → ⚙️ legacy (profile=legacy)     — disponible 30 días tras cutover
#   - ollama      → ⚠️ opcional, recomendado en host para no duplicar memoria
#   - nginx       → ✅ reverse proxy con routing / → web · /legacy → streamlit · /api → api
#
# Comandos comunes (local):
#   docker compose up mcp-server api web nginx     # stack completo Beta-2
#   docker compose --profile legacy up streamlit   # solo si necesitas la UI vieja
#
# Despliegue en producción: ver docs/deployment_runbook.md.

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    env_file: .env
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - mcp-server

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3001"
    depends_on:
      - api

  streamlit:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.streamlit
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp-server:3000/sse
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - mcp-server

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  # === Opcional: Ollama containerizado (default: usar host con host.docker.internal) ===
