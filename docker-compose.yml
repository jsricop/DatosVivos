# DatosVivos — Docker Compose
#
# Estado actual (Sprint 4):
#   - mcp-server  → ✅ funcional (Sprint 1)
#   - streamlit   → ✅ funcional (Sprint 4) — requiere índice vectorial montado
#   - ollama      → ⚠️ opcional, recomendado correrlo en host para no duplicar memoria
#   - postgres    → 🔜 referencia, fuera del scope del Sprint 4
#   - nginx       → 🔜 reverse proxy HTTPS, fuera del scope del Sprint 4
#
# Para ejecutar HOY (Sprint 4 sin Power BI):
#   docker compose up mcp-server streamlit
#
# El servicio `streamlit` espera el índice vectorial en /app/data/vector_index;
# se monta como volumen desde ./data/vector_index del host. Generar el índice:
#   python -m scripts.build_index

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
    ports:
      - "3000:3000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp-server:3000/sse
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Streamlit por default solo pone /app/app en sys.path (el dir del script
      # principal). Necesitamos /app para que `from ai_engine.X import Y` y
      # `from mcp_server.X import Y` funcionen desde cualquier página.
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    volumes:
      # data/ es read-write porque scripts.build_index escribe el índice
      # vectorial aquí. El UID/GID del container coincide con el host
      # (vía build-args APP_UID/APP_GID) para evitar problemas de permisos.
      - ./data:/app/data
    depends_on:
      - mcp-server

