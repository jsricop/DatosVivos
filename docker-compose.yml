# DatosVivos — Docker Compose
#
# Estado actual (Sprint 1): solo el servicio `mcp-server` es funcional.
# Los demás están comentados y se habilitarán en sus sprints correspondientes:
#   - postgres, api    → Sprint 4
#   - streamlit, nginx → Sprint 4
#   - ollama           → Sprint 3
#
# Para ejecutar HOY:
#   docker compose up mcp-server
#
# Cuando se implementen los demás servicios, se descomentarán aquí y se actualizará
# §22 de MAIN.md para reflejar el cambio.

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
    ports:
      - "3000:3000"

