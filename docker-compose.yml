# DatosVivos — Docker Compose
#
# Estado (Beta-2 + módulo BI ejecutivo):
#   - mcp-server  → ✅ funcional (Sprint 1)        — clientes MCP externos
#   - api         → ✅ FastAPI + SSE (ADR-013)     — backend de la SPA
#   - web         → ✅ Next.js 15 (ADR-011)        — frontend Civic Editorial
#   - postgres    → ✅ ACTIVO (ADR-014)            — telemetría + catálogo para PowerBI
#   - streamlit   → ⚙️ legacy (profile=legacy)     — disponible 30 días tras cutover
#   - ollama      → ⚠️ opcional, recomendado en host para no duplicar memoria
#   - nginx       → ✅ reverse proxy con routing / → web · /legacy → streamlit · /api → api
#
# Comandos comunes (local):
#   docker compose up postgres -d                  # solo BD
#   docker compose up mcp-server api web nginx     # stack completo Beta-2
#   docker compose --profile legacy up streamlit   # solo si necesitas la UI vieja
#
# Despliegue en producción: ver docs/deployment_runbook.md.

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datosvivos}
      POSTGRES_USER: ${POSTGRES_USER:-dv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postgres password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dv} -d ${POSTGRES_DB:-datosvivos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    restart: unless-stopped
    env_file: .env
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Tiered models (ADR-015). Si _FAST/_NARRATIVE están vacíos, model_for_task
      # cae a OLLAMA_MODEL (legacy) para preservar compatibilidad.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_MODEL_FAST: ${OLLAMA_MODEL_FAST:-qwen2.5-coder:3b}
      OLLAMA_MODEL_NARRATIVE: ${OLLAMA_MODEL_NARRATIVE:-qwen2.5:7b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://dv:${POSTGRES_PASSWORD}@postgres:5432/datosvivos}
      PYTHONPATH: /app
      # Caché del modelo de EMBEDDINGS (e5-base, re-rank semántico) en el
      # volumen ./data: dentro del contenedor se perdía en cada recreate y
      # el primer query re-descargaba 1.1 GB de HF — el 2026-07-13 la
      # descarga se estancó y /buscar quedó colgado en 504.
      HF_HOME: /app/data/hf_cache
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mcp-server:
        condition: service_started
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # NEXT_PUBLIC_SITE_URL se inlinea en el bundle al hacer `npm run build`.
        # Default a producción; override en dev con `NEXT_PUBLIC_SITE_URL=...`.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://datosvivos.co}
    restart: unless-stopped
    # env_file pasa variables de RUNTIME a Next.js (p. ej. PBI_EMBED_URL, que
    # el server component /tablero lee en cada request). Runtime — no build —
    # así cambiar la URL del tablero solo requiere recrear el contenedor web.
    env_file: .env
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3001"
    depends_on:
      - api
      - postgres

  streamlit:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.streamlit
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp-server:3000/sse
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - mcp-server

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  # === Opcional: Ollama containerizado (default: usar host con host.docker.internal) ===
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama

volumes:
  postgres_data:
  # ollama_models:
