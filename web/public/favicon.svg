<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DatosVivos">
  <title>DatosVivos</title>
  <style>
    .bg { fill: #F3EFE3; }
    .stroke { stroke: #16130E; stroke-width: 2; fill: none; }
    .ink { fill: #16130E; }
    .accent { fill: #A52A2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E0C08; }
      .stroke { stroke: #E8E1CE; }
      .ink { fill: #E8E1CE; }
      .accent { fill: #C24A4A; }
    }
    text {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 38px;
      letter-spacing: -1px;
      text-anchor: middle;
    }
  </style>
  <rect class="bg" x="0" y="0" width="64" height="64" />
  <rect class="stroke" x="1" y="1" width="62" height="62" />
  <text class="ink" x="20" y="44">D</text>
  <text class="accent" x="32" y="44">|</text>
  <text class="ink" x="44" y="44">V</text>
</svg>
